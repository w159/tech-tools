name: release

# Publishes a GitHub release `<plugin> <version>` (tag <plugin>-v<version>) for
# atlas, armada and programmer whenever a plugin.json changes on main, for each
# plugin whose tag does not exist yet. Notes come from that plugin's CHANGELOG.md
# via plugins/atlas/scripts/release_notes.py. workflow_dispatch backfills any
# plugin that has no release.
on:
  push:
    branches: [main]
    paths:
      - plugins/atlas/.claude-plugin/plugin.json
      - plugins/armada/.claude-plugin/plugin.json
      - plugins/programmer/.claude-plugin/plugin.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # The gate installs a third-party CLI (npm lifecycle scripts run), so it lives in its own job: read-only token,
  # no secrets, no checkout credentials. The release job below holds the write token and only runs if this passes.
  mod-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4

      # No --ignore-scripts: the CLI's postinstall fetches its native binary and the CLI does not run without it
      # (checked locally on 2.1.325: "claude native binary not installed").
      - name: Release gate - the atlas mod's hooks module loads in the real host and the band renders
        run: |
          npm install -g @anthropic-ai/claude-code@2.1.325
          claude --version
          python3 plugins/atlas/scripts/atlas_mod_gate.py --live --require-live

  release:
    needs: mod-gate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Release each plugin whose tag is missing
        run: |
          set -euo pipefail
          for name in atlas armada programmer; do
            ver=$(python3 -c "import json,sys;print(json.load(open(sys.argv[1]))['version'])" "plugins/$name/.claude-plugin/plugin.json")
            tag="$name-v$ver"
            # ls-remote --exit-code: 0 = tag present, 2 = no match; anything else
            # (e.g. 128: broken origin or auth) is a failure, never "tag absent".
            rc=0
            git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1 || rc=$?
            if [ "$rc" -eq 0 ]; then
              echo "Tag $tag already exists; skipping."
              continue
            elif [ "$rc" -ne 2 ]; then
              echo "::error::git ls-remote failed (exit $rc) while checking tag $tag; refusing to release"
              exit 1
            fi

            # The marketplace entry must carry the same version when it has one.
            python3 - "$name" "$ver" <<'PY'
          import json, sys
          name, want = sys.argv[1:3]
          m = json.load(open(".claude-plugin/marketplace.json"))
          got = [p.get("version", want) for p in m["plugins"] if p.get("name") == name]
          if got != [want]:
              sys.exit(f"::error::marketplace.json {name} version {got} != plugin.json {want}; bump both before releasing")
          PY

            python3 plugins/atlas/scripts/release_notes.py "$ver" "plugins/$name/CHANGELOG.md" > notes.md || {
              echo "::error::plugins/$name/CHANGELOG.md has no released '## $ver' section (missing or marked unreleased)"; exit 1; }

            zip -qr "$name.zip" "plugins/$name" -x '*/node_modules/*' '*/.git/*' '*/__pycache__/*' '*.pyc' '*/.pytest_cache/*' '*/.venv/*' '*/tests/*'
            assets=""
            if [ "$(stat -c %s "$name.zip")" -ge 104857600 ]; then
              rm "$name.zip"
              printf '\n\nNote: plugin zip exceeded 100 MB, so no asset is attached.\n' >> notes.md
            else
              mv "$name.zip" "$name-$ver.zip"
              assets="$name-$ver.zip"
            fi

            gh release create "$tag" $assets \
              --target "$GITHUB_SHA" \
              --title "$name $ver" \
              --notes-file notes.md
          done
