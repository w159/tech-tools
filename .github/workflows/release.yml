name: release

# Publishes a GitHub release `<plugin> <version>` (tag <plugin>-v<version>) for
# atlas, armada and programmer whenever a plugin.json changes on main, for each
# plugin whose tag does not exist yet. Notes come from that plugin's CHANGELOG.md
# via plugins/atlas/scripts/release_notes.py. workflow_dispatch backfills any
# plugin that has no release.
on:
  push:
    branches: [main]
    paths:
      - plugins/atlas/.claude-plugin/plugin.json
      - plugins/armada/.claude-plugin/plugin.json
      - plugins/programmer/.claude-plugin/plugin.json
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Release each plugin whose tag is missing
        run: |
          set -euo pipefail
          for name in atlas armada programmer; do
            ver=$(python3 -c "import json,sys;print(json.load(open(sys.argv[1]))['version'])" "plugins/$name/.claude-plugin/plugin.json")
            tag="$name-v$ver"
            if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
              echo "Tag $tag already exists; skipping."
              continue
            fi

            # The marketplace entry must carry the same version when it has one.
            python3 - "$name" "$ver" <<'PY'
          import json, sys
          name, want = sys.argv[1:3]
          m = json.load(open(".claude-plugin/marketplace.json"))
          got = [p.get("version", want) for p in m["plugins"] if p.get("name") == name]
          if got != [want]:
              sys.exit(f"::error::marketplace.json {name} version {got} != plugin.json {want}; bump both before releasing")
          PY

            python3 plugins/atlas/scripts/release_notes.py "$ver" "plugins/$name/CHANGELOG.md" > notes.md || {
              echo "::error::plugins/$name/CHANGELOG.md has no released '## $ver' section (missing or marked unreleased)"; exit 1; }

            zip -qr "$name.zip" "plugins/$name" -x '*/node_modules/*' '*/.git/*'
            assets=""
            if [ "$(stat -c %s "$name.zip")" -ge 104857600 ]; then
              rm "$name.zip"
              printf '\n\nNote: plugin zip exceeded 100 MB, so no asset is attached.\n' >> notes.md
            else
              mv "$name.zip" "$name-$ver.zip"
              assets="$name-$ver.zip"
            fi

            gh release create "$tag" $assets \
              --target "$GITHUB_SHA" \
              --title "$name $ver" \
              --notes-file notes.md
          done
