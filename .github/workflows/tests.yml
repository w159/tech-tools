name: tests

# Fast, hermetic checks only: no network, no vendor credentials, no Bun/herdr.
# The vendored falcon MCP tests and the omp (Bun) suites are not run here.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    # the full job below owns push/schedule/dispatch runs on its own
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      # ubuntu-latest (24.04) ships Python 3.12; a venv avoids the PEP 668 system-pip block.
      - run: python3 --version && python3 -m venv .venv && .venv/bin/python -m pip install --quiet pytest
      - run: .venv/bin/python scripts/check_versions.py
      - run: .venv/bin/python -m pytest -q -p no:cacheprovider scripts plugins/armada/tests plugins/programmer/tests plugins/atlas/hooks/test_atlas_contract.py

  # The owner does not want Claude credited in commits or listed as a contributor.
  # Checks only the commits this push or PR adds; a force push or new branch checks all of HEAD.
  attribution:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
      - name: No Claude author, committer or trailer in new commits
        env:
          BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ -n "$PR_BASE" ]; then
            range="$PR_BASE..$PR_HEAD"
          elif [ -n "$BEFORE" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            range="$BEFORE..HEAD"
          else
            range="HEAD"
          fi
          echo "checking $range"
          python3 scripts/check_attribution.py "$range"

  # Full root pytest suite plus the omp (Bun) suites. Slow, so not run on PRs.
  full:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      # tmux is used by the atlas colony/mux tests; ubuntu-latest does not guarantee it.
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq tmux
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: python3 --version && python3 -m venv .venv && .venv/bin/python -m pip install --quiet pytest
      - run: .venv/bin/python -m pytest -q -p no:cacheprovider
      - run: bun test
        working-directory: plugins/atlas/omp
