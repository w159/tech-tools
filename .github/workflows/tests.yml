name: tests

# Fast, hermetic checks only: no network, no vendor credentials, no Bun/herdr.
# The vendored falcon MCP tests are not run here.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    # the full job below owns push/schedule/dispatch runs on its own
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      # ubuntu-latest (24.04) ships Python 3.12; a venv avoids the PEP 668 system-pip block.
      - run: python3 --version && python3 -m venv .venv && .venv/bin/python -m pip install --quiet pytest
      - run: .venv/bin/python scripts/check_versions.py
      - run: .venv/bin/python -m pytest -q -p no:cacheprovider scripts plugins/armada/tests plugins/programmer/tests plugins/atlas/hooks/test_atlas_contract.py

  # Telemetry receiver: node:test only, no install needed (the Blob SDK is imported lazily).
  telemetry-server:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - run: node --version && node --test
        working-directory: telemetry/server

  # Atlas Bun suites: the omp extension and the Claude Code mods (mod/ runs through mod/test-shim.ts, see
  # mod/TESTING.md). Run from plugins/atlas so bunfig.toml loads the preloads.
  atlas-bun:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      - run: bun test omp mod
        working-directory: plugins/atlas

  # Release gate: the mod's hooks module must load the way a Claude Code session loads it and the band must render
  # (plugins/atlas/scripts/atlas_mod_gate.py; --live adds the real host via the pinned CLI, isolated HOME;
  # --require-live turns a live check that did not really run into a failure instead of a skip).
  atlas-mod-gate:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      - run: npm install -g @anthropic-ai/claude-code@2.1.325
      - run: claude --version
      - run: python3 plugins/atlas/scripts/atlas_mod_gate.py --live --require-live

  # Early warning, never blocking: the same gate against the newest published CLI, so a host change that rejects the
  # mod shows up before the pin is bumped. continue-on-error keeps a red run from failing the workflow.
  atlas-mod-gate-latest:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      - run: npm install -g @anthropic-ai/claude-code@latest
      - run: claude --version
      - run: python3 plugins/atlas/scripts/atlas_mod_gate.py --live --require-live

  # The owner does not want Claude credited in commits or listed as a contributor.
  # Checks only the commits this push or PR adds; a force push or new branch checks all of HEAD.
  attribution:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
      - name: No Claude author, committer or trailer in new commits
        env:
          BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ -n "$PR_BASE" ]; then
            range="$PR_BASE..$PR_HEAD"
          elif [ -n "$BEFORE" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            range="$BEFORE..HEAD"
          else
            range="HEAD"
          fi
          echo "checking $range"
          python3 scripts/check_attribution.py "$range"

  # Full root pytest suite plus the omp (Bun) suites. Slow, so not run on PRs.
  full:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      # tmux is used by the atlas colony/mux tests; ubuntu-latest does not guarantee it.
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq tmux
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      - run: python3 --version && python3 -m venv .venv && .venv/bin/python -m pip install --quiet pytest
      - run: .venv/bin/python -m pytest -q -p no:cacheprovider
      - run: bun test
        working-directory: plugins/atlas
