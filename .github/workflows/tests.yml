name: tests

# Hermetic checks only: no vendor credentials. Every atlas suite (hooks, scripts, mod, omp, herdr) runs on pull
# requests. The vendored falcon MCP tests are not run here. On a push, the sibling jobs (tests, atlas-py-fast,
# atlas-py-slow, atlas-bun) run in parallel and the full job below runs only what none of them runs (the rest of the
# root pytest collection and the Bun directories atlas-bun skips). tests, atlas-py-* and atlas-bun also run on
# workflow_dispatch, so a dispatch covers the same ground as a push.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    # runs on pull_request, push and workflow_dispatch; the full job covers only what is left over
    if: github.event_name == 'pull_request' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      # ubuntu-latest (24.04) ships Python 3.12; a venv avoids the PEP 668 system-pip block.
      - run: python3 --version && python3 -m venv .venv && .venv/bin/python -m pip install --quiet pytest
      - run: .venv/bin/python scripts/check_versions.py
      # plugins/atlas hooks and scripts are not listed here: the atlas-py-fast and atlas-py-slow jobs run them all.
      - run: .venv/bin/python -m pytest -q -p no:cacheprovider scripts plugins/armada/tests plugins/programmer/tests

  # Atlas Python suites, split in two tiers that run as parallel jobs. The slow set is ONE list,
  # plugins/atlas/ci-slow-tests.txt; scripts/test_ci_tiers.py proves every test_*.py under hooks/ and scripts/ is in
  # exactly one tier (a file not on the list is fast). Per-file timings are in that list's header. tmux is used by
  # the colony/mux tests; ubuntu-latest does not guarantee it.
  atlas-py-fast:
    if: github.event_name == 'pull_request' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq tmux
      - run: python3 --version && python3 -m venv .venv && .venv/bin/python -m pip install --quiet pytest
      - name: hooks and scripts, minus the slow list
        working-directory: plugins/atlas
        run: |
          ign=""
          for f in $(grep -E '^(hooks|scripts)/' ci-slow-tests.txt); do ign="$ign --ignore=$f"; done
          ../../.venv/bin/python -m pytest -q -p no:cacheprovider hooks scripts $ign

  atlas-py-slow:
    if: github.event_name == 'pull_request' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        dir: [hooks, scripts]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq tmux
      - run: python3 --version && python3 -m venv .venv && .venv/bin/python -m pip install --quiet pytest
      - name: the slow list for ${{ matrix.dir }}
        working-directory: plugins/atlas
        run: ../../.venv/bin/python -m pytest -q -p no:cacheprovider $(grep -E '^${{ matrix.dir }}/' ci-slow-tests.txt)

  # Telemetry receiver: node:test only, no install needed (the Blob SDK is imported lazily).
  telemetry-server:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - run: node --version && node --test
        working-directory: telemetry/server

  # Atlas Bun suites: the omp extension and the Claude Code mods (mod/ runs through mod/test-shim.ts, see
  # mod/TESTING.md). Run from plugins/atlas so bunfig.toml loads the preloads. The other Bun directories (colony,
  # scripts) run in the full job.
  # Typecheck: tsconfig.json extends .claude-plugin/types/tsconfig.json, which the Claude Code host generates locally and
  # .gitignore excludes (plugins/atlas/.claude-plugin/types), so a checkout has no host types and tsc reports TS5083 plus
  # hundreds of host-type errors. Measured on 2026-11-18 (two identical runs): 890 `error TS` lines, 369 TS2307 (all on
  # the bare specifiers claude-code and claude-code/testing), 0 TS2307 on relative specifiers. The 890 is not a stable
  # ratchet (it moves with the host types and the typescript version), but the relative-specifier TS2307 count is
  # stable at 0 and catches a broken file move, so the step below fails on any unresolved relative import.
  atlas-bun:
    if: github.event_name == 'pull_request' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      - run: bun test omp mod
        working-directory: plugins/atlas
      - name: relative imports resolve (tsc TS2307 on ./ and ../ specifiers must be 0)
        working-directory: plugins/atlas
        run: |
          rc=0
          out=$(bunx --package typescript@5 tsc --noEmit -p tsconfig.json) || rc=$?
          # tsc exits 0 or 2; anything else means it did not run, which must not pass as "no broken imports"
          if [ "$rc" -gt 2 ]; then echo "tsc did not run (exit $rc)"; printf '%s\n' "$out"; exit 1; fi
          bad=$(printf '%s\n' "$out" | grep 'TS2307' | grep -E "module '\.\.?/" || true)
          if [ -n "$bad" ]; then printf '%s\n' "$bad"; echo "unresolved relative import(s)"; exit 1; fi

  # herdr web UI: bunfig.toml at plugins/atlas ignores colony/herdr-web-ui (its contract tests need a herdr server of
  # their own), so this job runs them from that directory. The herdr binary is the checksum-pinned release the
  # vendored colony/herdr-web-ui/.github/workflows/ci.yml installs. Its browser lane is not run here.
  atlas-herdr:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      HERDR_TEST_SESSION: ci-${{ github.run_id }}-${{ github.run_attempt }}
      XDG_CONFIG_HOME: ${{ github.workspace }}/.ci-config
      HERDR_WEB_STATE_DIR: ${{ github.workspace }}/.ci-state
      # One integration file at a time: the timing-bound contract tests fail in turn when four share the runner.
      HERDR_TEST_SHARDS: 1
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      - name: Install checksum-pinned herdr 0.9.3
        run: |
          mkdir -p "$RUNNER_TEMP/herdr-bin"
          curl --fail --location --retry 3 https://github.com/herdrdev/herdr/releases/download/v0.9.3/herdr-linux-x86_64 -o "$RUNNER_TEMP/herdr-bin/herdr"
          echo "18a8dc65f1c2fa485884344356dea1cfd911c6f06cf46fa78e193f4087f4dba7  $RUNNER_TEMP/herdr-bin/herdr" | sha256sum --check
          chmod +x "$RUNNER_TEMP/herdr-bin/herdr"
          echo "$RUNNER_TEMP/herdr-bin" >> "$GITHUB_PATH"
      - run: bun install --frozen-lockfile
        working-directory: plugins/atlas/colony/herdr-web-ui
      - run: bun run build
        working-directory: plugins/atlas/colony/herdr-web-ui
      - name: Unit tests (no herdr needed)
        working-directory: plugins/atlas/colony/herdr-web-ui
        run: |
          git config --global user.email ci@example.invalid
          git config --global user.name CI
          bun run test:unit
      - name: Integration tests (herdr session of their own)
        working-directory: plugins/atlas/colony/herdr-web-ui
        run: bun run test:integration
      - name: Stop the owned test session
        if: always()
        run: herdr --session "$HERDR_TEST_SESSION" server stop || true

  # Release gate: the mod's hooks module must load the way a Claude Code session loads it and the band must render
  # (plugins/atlas/scripts/atlas_mod_gate.py; --live adds the real host via the pinned CLI, isolated HOME;
  # --require-live turns a live check that did not really run into a failure instead of a skip).
  atlas-mod-gate:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      - run: npm install -g @anthropic-ai/claude-code@2.1.325
      - run: claude --version
      - run: python3 plugins/atlas/scripts/atlas_mod_gate.py --live --require-live

  # The owner does not want Claude credited in commits or listed as a contributor.
  # Checks only the commits this push or PR adds; a force push or new branch checks all of HEAD.
  attribution:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
      - name: No Claude author, committer or trailer in new commits
        env:
          BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ -n "$PR_BASE" ]; then
            range="$PR_BASE..$PR_HEAD"
          elif [ -n "$BEFORE" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            range="$BEFORE..HEAD"
          else
            range="HEAD"
          fi
          echo "checking $range"
          python3 scripts/check_attribution.py "$range"

  # Catch-all for what no sibling job runs, so a push or dispatch loses no test and repeats none. Not run on PRs (the
  # jobs above cover the atlas suites there). Pytest: the root collection minus plugins/atlas/hooks, plugins/atlas/scripts
  # (atlas-py-fast and atlas-py-slow) and scripts, plugins/armada/tests, plugins/programmer/tests (the tests job); what
  # remains is plugins/atlas/skills and plugins/atlas/mod (5 test files). Bun: the plugins/atlas
  # test directories atlas-bun does not run (colony and scripts; omp and mod are atlas-bun's; colony/herdr-web-ui is
  # ignored by bunfig.toml and run by atlas-herdr).
  full:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - run: python3 scripts/check_versions.py
      # tmux is used by the atlas colony/mux tests; ubuntu-latest does not guarantee it.
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq tmux
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      - run: python3 --version && python3 -m venv .venv && .venv/bin/python -m pip install --quiet pytest
      - run: .venv/bin/python -m pytest -q -p no:cacheprovider --ignore=plugins/atlas/hooks --ignore=plugins/atlas/scripts --ignore=scripts --ignore=plugins/armada/tests --ignore=plugins/programmer/tests
      - run: bun test ./colony ./scripts
        working-directory: plugins/atlas
