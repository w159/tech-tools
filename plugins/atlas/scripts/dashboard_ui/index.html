<!doctype html>
<html lang="en" data-theme="dark" data-density="compact">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <meta name="atlas-token" content="__ATLAS_TOKEN__" />
    <meta name="atlas-version" content="__ATLAS_VERSION__" />
    <meta name="atlas-base" content="" />
    <title>Atlas Command Center</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%233ddbb8' stroke-width='2' stroke-linejoin='round' stroke-linecap='round'%3E%3Cpath d='M12 2l9 5v10l-9 5-9-5V7z'/%3E%3Cpath d='M12 12l9-5M12 12v10M12 12L3 7'/%3E%3C/svg%3E"
    />
    <script>
      // Same-origin gateway support: <meta name="atlas-base" content="/atlas"> prefixes every /ui asset.
      // Empty (the default) leaves the standalone dashboard at 127.0.0.1:7421 unchanged.
      (function () {
        var m = document.querySelector('meta[name="atlas-base"]');
        var base = ((m && m.getAttribute("content")) || "").replace(/\/+$/, "");
        window.__ATLAS_BASE__ = base;
        // Theme before first paint (dark | light | system), so there is no flash.
        try {
          var t = localStorage.getItem("atlas.theme") || "dark";
          if (t === "system")
            t = matchMedia("(prefers-color-scheme: light)").matches
              ? "light"
              : "dark";
          document.documentElement.setAttribute(
            "data-theme",
            t === "light" ? "light" : "dark",
          );
          if (localStorage.getItem("atlas.collapsed") === "1")
            document.documentElement.setAttribute("data-collapsed", "true");
        } catch (e) {}
        [
          "tokens",
          "base",
          "ui",
          "shell",
          "pages",
          "settings",
          "terminal",
        ].forEach(function (n) {
          document.write(
            '<link rel="stylesheet" href="' + base + "/ui/css/" + n + '.css">',
          );
        });
        document.write(
          '<link rel="stylesheet" href="' +
            base +
            '/ui/vendor/xterm/xterm.css">',
        );
        document.write(
          '<script type="module" src="' + base + '/ui/js/app.js"><\/script>',
        );
      })();
    </script>
  </head>
  <body>
    <a class="sr-only" href="#page-root">Skip to content</a>
    <div class="app" id="app"></div>
    <div class="toasts" id="toasts" role="status" aria-live="polite"></div>
    <noscript>Atlas Command Center needs JavaScript.</noscript>
  </body>
</html>
